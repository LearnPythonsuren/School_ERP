<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Scholar ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6FA;--surface:#fff;--surface-2:#F8F9FC;--line:#E7E9F1;
    --ink:#171A2B;--ink-2:#5A5F76;--ink-3:#8A8FA6;
    --primary:#2B4EE6;--primary-ink:#1B34AE;--primary-wash:#EDF0FE;
    --green:#0FA968;--green-wash:#E6F7EF;--red:#E5484D;--red-wash:#FCEEEE;--amber:#B8770B;--amber-wash:#FEF3E2;
    --radius:14px;--shadow:0 1px 2px rgba(23,26,43,.05),0 10px 30px rgba(23,26,43,.07);
    --font:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0D0F1A;--surface:#161927;--surface-2:#1B1F30;--line:#272B3D;
    --ink:#EDEEF5;--ink-2:#A6ABC2;--ink-3:#71768F;--primary:#6E88F6;--primary-ink:#AEBEFB;--primary-wash:#1E2440;
    --green:#3ECF8E;--green-wash:#12321F;--red:#F16A6E;--red-wash:#3A1D1E;--amber:#F0B44C;--amber-wash:#3A2C12;}}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0;letter-spacing:-.02em}
  a{color:var(--primary)}
  :focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
  textarea{min-height:110px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-wash)}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
  .field{margin-bottom:14px}.field .ferr{color:var(--red);font-size:12px;margin-top:5px;display:none}.field.bad .ferr{display:block}.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--red)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;white-space:nowrap}
  .btn:hover{background:var(--surface-2)}.btn:disabled{opacity:.55;cursor:default}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-ink)}
  .btn.danger{color:var(--red)}.btn.danger.solid{background:var(--red);border-color:var(--red);color:#fff}
  .btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
  .btn.ghost{border-color:transparent;background:none}
  .err{display:none;background:var(--red-wash);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:14px}.err.show{display:block}
  .note{background:var(--amber-wash);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:16px}
  .muted{color:var(--ink-3)}.small{font-size:12.5px}.right{text-align:right}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}

  /* Login */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);width:100%;max-width:430px;overflow:hidden}
  .login-head{padding:26px 24px 6px;text-align:center}
  .brandmark{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,var(--primary),#5B72F0);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;margin:0 auto 12px}
  .login-head h1{font-size:21px;font-weight:800}.login-head p{color:var(--ink-3);font-size:13px;margin:4px 0 0}
  .tabs{display:flex;gap:6px;padding:16px 24px 0}
  .tabs button{flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:10px;padding:9px;font-weight:700;font-size:13px}
  .tabs button.on{background:var(--primary-wash);color:var(--primary-ink);border-color:var(--primary-wash)}
  .login-body{padding:16px 24px 22px}
  .hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
  details.srv summary{font-size:12.5px;color:var(--ink-3);cursor:pointer;margin-bottom:10px}
  .demo{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .demo button{border:0;background:var(--surface-2);color:var(--ink-2);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;margin:0 4px 6px 0}

  /* Shell */
  .shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
  .sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 8px}
  .brand .m{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#5B72F0);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
  .brand b{font-size:15px;font-weight:800;display:block;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brand small{display:block;color:var(--ink-3);font-size:11px}
  .nav{padding:4px 12px 12px;flex:1;overflow:auto}
  .nav .grp{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:14px 12px 6px}
  .nav button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:var(--ink-2);padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px;text-align:left;margin-bottom:1px}
  .nav button svg{width:18px;height:18px;flex:none}
  .nav button:hover{background:var(--surface-2);color:var(--ink)}
  .nav button.on{background:var(--primary-wash);color:var(--primary-ink)}
  .main{min-width:0;display:flex;flex-direction:column}
  .top{position:sticky;top:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px;z-index:20}
  .top h2{font-size:18px;font-weight:800}.top .sp{flex:1}
  .menu-btn{display:none}
  .acct{position:relative}
  .acct-btn{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 10px 5px 5px;color:var(--ink)}
  .avatar{width:30px;height:30px;border-radius:9px;background:var(--primary-wash);color:var(--primary-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
  .acct-btn .who{text-align:left;line-height:1.2}.acct-btn .who b{font-size:13px;display:block}.acct-btn .who span{font-size:11px;color:var(--ink-3)}
  .dropdown{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:210px;padding:6px;display:none}
  .dropdown.open{display:block}
  .dropdown button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 11px;border-radius:8px;font-size:14px;font-weight:600}
  .dropdown button:hover{background:var(--surface-2)}
  .content{padding:22px;max-width:1240px;width:100%}
  .scrim{display:none}

  /* Building blocks */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar input,.toolbar select{width:auto;min-width:150px}
  .toolbar input[type=search]{min-width:220px}
  .toolbar .sp{flex:1}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{border:0;background:none;color:var(--ink-2);padding:6px 11px;border-radius:7px;font-weight:700;font-size:13px}
  .seg button.on{background:var(--primary-wash);color:var(--primary-ink)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .kpi .cap{color:var(--ink-2);font-size:13px;font-weight:600}
  .kpi .num{font-size:25px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi .sub{color:var(--ink-3);font-size:12px;margin-top:3px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
  .panel-h{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .panel-h h3{font-size:15px;font-weight:700}.panel-h .sp{flex:1}
  .panel-b{padding:16px 18px}
  table{width:100%;border-collapse:collapse}
  .tbl{overflow-x:auto}
  th{text-align:left;font-size:12px;color:var(--ink-2);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
  td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap;vertical-align:middle}
  td.wrap{white-space:normal;min-width:200px}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:var(--surface-2)}
  td .acts{display:flex;gap:6px;justify-content:flex-end}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--surface-2);color:var(--ink-2);text-transform:capitalize}
  .pill.ok{background:var(--green-wash);color:var(--green)}
  .pill.bad{background:var(--red-wash);color:var(--red)}
  .pill.warn{background:var(--amber-wash);color:var(--amber)}
  .pill.info{background:var(--primary-wash);color:var(--primary-ink)}
  .key{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px}
  .row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
  .card h4{font-size:15px;font-weight:800}
  .card .meta{color:var(--ink-3);font-size:12.5px;margin-top:3px}
  .card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .bar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin-top:10px}
  .bar>i{display:block;height:100%;background:var(--primary);border-radius:8px}
  .bar.ok>i{background:var(--green)}.bar.warn>i{background:var(--amber)}.bar.bad>i{background:var(--red)}
  .minibar{display:inline-block;width:60px;height:6px;border-radius:6px;background:var(--surface-2);vertical-align:middle;margin-right:6px;overflow:hidden}.minibar>i{display:block;height:100%;background:var(--green)}
  .chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
  .chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .chart .col i{display:block;width:100%;max-width:38px;background:var(--primary);border-radius:6px 6px 3px 3px;min-height:3px}
  .chart .col span{font-size:11.5px;color:var(--ink-3)}.chart .col b{font-size:11.5px}
  .hbars .hb{display:grid;grid-template-columns:120px 1fr 60px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}
  .hbars .hb .bar{margin:0}
  .list .it{padding:11px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border-bottom:0}
  .list .it b{display:block}
  .empty{padding:34px 16px;text-align:center;color:var(--ink-3)}
  .pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
  .att{display:inline-flex;gap:4px}
  .att button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:8px;width:34px;height:30px;font-weight:800;font-size:12.5px}
  .att button.on.p{background:var(--green);border-color:var(--green);color:#fff}
  .att button.on.a{background:var(--red);border-color:var(--red);color:#fff}
  .att button.on.l{background:var(--amber);border-color:var(--amber);color:#fff}
  .tt td{white-space:normal;min-width:120px;vertical-align:top;padding:8px}
  .slot{border-radius:10px;padding:8px 10px;background:var(--primary-wash);color:var(--primary-ink);font-size:13px;min-height:54px}
  .slot small{display:block;color:var(--ink-2);font-size:11.5px;margin-top:2px}
  .slot.empty-slot{background:none;border:1px dashed var(--line);color:var(--ink-3);display:grid;place-items:center}
  button.slotbtn{all:unset;display:block;width:100%;cursor:pointer;border-radius:10px}
  button.slotbtn:focus-visible{outline:3px solid var(--primary)}
  .map{width:100%;height:280px;border:0;border-radius:12px;background:var(--surface-2)}
  .lock{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
  .lock .box{max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow)}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(10,12,22,.5);display:grid;place-items:center;padding:16px;z-index:60;animation:fade .15s}
  .modal{background:var(--surface);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:520px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
  .modal.wide{max-width:720px}
  .modal-h{padding:18px 20px 10px;display:flex;align-items:center;gap:10px}.modal-h h3{font-size:17px;font-weight:800;flex:1}
  .modal-b{padding:6px 20px 8px;overflow:auto}
  .modal-f{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .modal-f .sp{flex:1}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.fgrid .full{grid-column:1/-1}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(calc(100% + 30px));visibility:hidden;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:transform .3s;z-index:80;max-width:calc(100vw - 32px)}
  .toast.show{transform:translateX(-50%) translateY(0);visibility:visible}

  @media(max-width:900px){
    .grid2{grid-template-columns:1fr}
    .shell{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
    .sidebar.open{transform:none}
    .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,12,22,.4);z-index:25}
    .menu-btn{display:inline-flex}
    .content{padding:16px}
    .top{padding:10px 16px}
    .acct-btn .who{display:none}
    .fgrid{grid-template-columns:1fr}
    .toolbar input,.toolbar select,.toolbar input[type=search]{min-width:0;flex:1 1 140px}
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const root = $("#root");
  const LS = "scholar_live_session";

  const S = Object.assign({ base: defaultBase(), mode: null, tenant: "", token: "", user: null, view: "" }, load() || {});
  const CFG = { settings: {}, classes: [] };       // runtime caches
  const VS = {};                                   // per-view filters, kept while navigating
  let refreshTimer = null;

  function load(){ try{ return JSON.parse(localStorage.getItem(LS)); }catch(e){ return null; } }
  function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
  // Served by Laravel/IIS → the API is on the same address. Opened from disk → assume `php artisan serve`.
  function defaultBase(){ return location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:8000"; }
  const isLocal = () => /\/\/(localhost|127\.0\.0\.1)(:|\/|$)/.test(S.base);

  function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2800); }
  const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const today = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  const addDays = (n) => new Date(Date.now() + n*864e5 - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

  // ---------------- formatting ----------------
  function money(n){
    const cur = CFG.settings.currency || "INR";
    try { return new Intl.NumberFormat(cur==="INR"?"en-IN":undefined, { style:"currency", currency:cur, maximumFractionDigits:0 }).format(Number(n||0)); }
    catch(e){ return cur+" "+Number(n||0).toLocaleString(); }
  }
  const num = n => Number(n||0).toLocaleString("en-IN");
  function fdate(d){
    if(!d) return "—";
    const s = String(d); const dt = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s+"T00:00:00") : new Date(s);
    return isNaN(dt) ? esc(s) : dt.toLocaleDateString("en-IN",{ day:"2-digit", month:"short", year:"numeric" });
  }
  function ago(d){
    if(!d) return "never"; const s = (Date.now() - new Date(d))/1000;
    if(s < 60) return "just now"; if(s < 3600) return Math.floor(s/60)+" min ago"; if(s < 86400) return Math.floor(s/3600)+" h ago"; return fdate(d);
  }
  const PILL = { paid:"ok", active:"ok", present:"ok", approved:"ok", returned:"ok", sent:"ok", on_route:"ok", enrolled:"info",
                 partial:"warn", leave:"warn", pending:"warn", draft:"warn", idle:"", issued:"info", maintenance:"warn", expired:"bad",
                 due:"bad", absent:"bad", rejected:"bad", suspended:"bad", revoked:"bad", overdue:"bad", none:"" };
  const pill = (s, label) => `<span class="pill ${PILL[s]??""}">${esc(label ?? String(s||"—").replace(/_/g," "))}</span>`;
  const pct = (a,b) => b ? Math.round(a*100/b) : 0;
  const initials = n => String(n||"?").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();

  // ---------------- API ----------------
  function qs(obj){ const p = new URLSearchParams(); Object.entries(obj||{}).forEach(([k,v])=>{ if(v!==undefined && v!==null && v!=="") p.set(k,v); }); const s=p.toString(); return s?"?"+s:""; }
  async function api(path, opts){
    opts = opts || {};
    const headers = { "Accept": opts.raw ? "*/*" : "application/json", "Content-Type":"application/json" };
    if (S.mode === "school" && S.tenant) headers["X-Tenant"] = S.tenant;
    if (S.token) headers["Authorization"] = "Bearer " + S.token;
    let res;
    try {
      res = await fetch(S.base.replace(/\/$/,"") + path + qs(opts.query), {
        method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
    } catch(e){ throw Object.assign(new Error("Cannot reach the server at " + S.base + ". Check your internet connection and the server URL."), { network:true }); }
    if (opts.raw && res.ok) return res;
    let data = null; if (res.status !== 204) { try { data = await res.json(); } catch(e){} }
    if (res.status === 401 && S.token) { doLogout(true); toast("Your session ended — please sign in again."); throw Object.assign(new Error("Session expired"), { handled:true }); }
    if (res.status === 403 && data && data.code === "license_inactive" && S.mode === "school") { renderLocked(data.message); throw Object.assign(new Error(data.message), { handled:true }); }
    if (!res.ok) {
      const msg = (data && (data.errors ? firstError(data) : data.message)) || ("Request failed ("+res.status+")");
      throw Object.assign(new Error(res.status===429 ? "Too many attempts. Please wait a minute and try again." : msg), { status: res.status, errors: data && data.errors, data });
    }
    return data;
  }
  function firstError(d){ const k = Object.keys(d.errors||{})[0]; return k ? d.errors[k][0] : d.message; }

  // ---------------- roles ----------------
  const roles = () => (S.user && S.user.roles) || [];
  const can = (...r) => roles().includes("super-admin") || r.some(x => roles().includes(x));

  // ---------------- icons ----------------
  const I = {
    dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
    students:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',

  async function signIn(){

    if (!allowed.includes(S.view)) S.view = allowed[0];

    if (S.mode === "school") { try { CFG.settings = await api("/api/settings") || {}; } catch(e){ if (e.handled) return; } }
    const schoolName = S.mode==="owner" ? "Control plane" : (CFG.settings.school_name || S.tenant);

    $$("#nav button").forEach(b => b.onclick = () => go(b.dataset.v));

    $("#menuBtn").onclick = () => { sb.classList.add("open"); scrim.classList.add("open"); };

    const menu = $("#acctMenu"), ab = $("#acctBtn");

  function go(v){ S.view = v; save(); $$("#nav button").forEach(b => { b.classList.toggle("on", b.dataset.v===v); b.toggleAttribute("aria-current", b.dataset.v===v); }); $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("open"); showView(); }
  async function showView(){
    stopRefresh(); closeModal();
    $("#ttl").textContent = TITLES[S.view] || "";

  const stopRefresh = () => { if (refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; } };
  const errBox = m => `<div class="err show" role="alert">${esc(m || "Something went wrong.")}</div>`;
  const vs = (name, def) => (VS[name] = VS[name] || def);
  function guarded(fn){ return async (...a) => { try { await fn(...a); } catch(e){ if(!e.handled) toast(e.message); } }; }

  // ---------------- UI helpers ----------------
  const kpi = (cap, val, sub) => `<div class="kpi"><div class="cap">${esc(cap)}</div><div class="num">${val}</div>${sub?`<div class="sub">${sub}</div>`:""}</div>`;
  function table(cols, rows, empty){
    if (!rows.length) return `<div class="empty">${esc(empty || "Nothing here yet.")}</div>`;
    return `<div class="tbl"><table><thead><tr>${cols.map(c=>`<th class="${c.cls||''}">${esc(c.h)}</th>`).join("")}</tr></thead><tbody>${
      rows.map(r => `<tr>${cols.map(c=>`<td class="${c.cls||''}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function pager(meta, onPage){
    if (!meta || !meta.last_page || meta.last_page <= 1) return meta && meta.total ? `<div class="pager">${num(meta.total)} records</div>` : "";
    const id = "pg" + Math.random().toString(36).slice(2,7);
    setTimeout(() => { const el = document.getElementById(id); if(!el) return;
      el.querySelector("[data-p=prev]").onclick = () => onPage(meta.current_page - 1);
      el.querySelector("[data-p=next]").onclick = () => onPage(meta.current_page + 1); });
    return `<div class="pager" id="${id}"><span>${num(meta.from)}–${num(meta.to)} of ${num(meta.total)}</span>
      <button class="btn sm" data-p="prev" ${meta.current_page<=1?"disabled":""}>‹ Prev</button>
      <button class="btn sm" data-p="next" ${meta.current_page>=meta.last_page?"disabled":""}>Next ›</button></div>`;
  }
  const metaOf = d => d.meta || d;   // Laravel resources nest paging under `meta`
  function seg(id, options, current){ return `<div class="seg" id="${id}" role="group">${options.map(([v,l])=>`<button type="button" data-v="${esc(v)}" class="${current===v?'on':''}" aria-pressed="${current===v}">${esc(l)}</button>`).join("")}</div>`; }
  function bindSeg(id, cb){ $$("#"+id+" button").forEach(b => b.onclick = () => cb(b.dataset.v)); }
  const opts = (list, cur, blank) => (blank!==undefined?`<option value="">${esc(blank)}</option>`:"") + list.map(o => { const [v,l] = Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}" ${String(cur)===String(v)?"selected":""}>${esc(l)}</option>`; }).join("");
  const bar = (p, kind) => `<div class="bar ${kind||''}"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
  async function classes(){ if (!CFG.classes.length && can("admin","teacher","accountant")) { try { CFG.classes = (await api("/api/students",{query:{per_page:1}})).classes || []; } catch(e){} } return CFG.classes; }
  const studentLabel = s => s ? `${s.name} · ${s.class_name||""} (#${s.id})` : "";

  // ---------------- modal + forms ----------------
  let modalClose = null;
  function closeModal(){ if (modalClose) modalClose(); }
  /**
   * form({ title, fields:[{k,label,type,options,required,placeholder,hint,full,min,max,step,list}],
   *        values, actions:[{name,label,kind}], onSubmit(values, action) -> truthy keeps modal open })
   */
  function form(cfg){
    return new Promise(resolve => {
      const values = cfg.values || {};
      const actions = cfg.actions || [{ name:"save", label: cfg.submit || "Save", kind:"primary" }];
      const fieldHtml = f => {
        const id = "f_"+f.k, v = values[f.k] ?? f.value ?? "";
        let input;
        if (f.type === "select") input = `<select id="${id}" name="${f.k}">${opts(f.options||[], v, f.blank)}</select>`;
        else if (f.type === "textarea") input = `<textarea id="${id}" name="${f.k}" placeholder="${esc(f.placeholder||"")}">${esc(v)}</textarea>`;
        else if (f.type === "student") input = `<input id="${id}" name="${f.k}" list="${id}_dl" autocomplete="off" placeholder="Start typing a student's name…" value="${esc(v)}"><datalist id="${id}_dl"></datalist>`;
        else input = `<input id="${id}" name="${f.k}" type="${f.type||"text"}" value="${esc(v)}" placeholder="${esc(f.placeholder||"")}" ${f.min!=null?`min="${f.min}"`:""} ${f.max!=null?`max="${f.max}"`:""} ${f.step?`step="${f.step}"`:""} ${f.list?`list="${id}_dl"`:""} ${f.type==="password"?'autocomplete="new-password"':""}>${f.list?`<datalist id="${id}_dl">${f.list.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`:""}`;
        return `<div class="field ${f.full||f.type==="textarea"?"full":""}" data-k="${f.k}"><label for="${id}">${esc(f.label)}${f.required?' <span style="color:var(--red)">*</span>':""}</label>${input}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}<div class="ferr"></div></div>`;
      };
      const fields = cfg.fields || [];
      const mr = $("#modalRoot");
      mr.innerHTML = `<div class="overlay" id="ovl"><form class="modal ${cfg.wide?"wide":""}" role="dialog" aria-modal="true" aria-labelledby="mTitle" novalidate>
        <div class="modal-h"><h3 id="mTitle">${esc(cfg.title)}</h3><button type="button" class="btn ghost sm" data-close aria-label="Close">${svg(I.x)}</button></div>
        <div class="modal-b"><div class="err" id="mErr" role="alert"></div>${cfg.html||""}<div class="${fields.length>1?"fgrid":""}">${fields.map(fieldHtml).join("")}</div></div>
        <div class="modal-f">${actions.filter(a=>a.kind==="danger").map(a=>`<button type="button" class="btn danger" data-act="${a.name}">${esc(a.label)}</button>`).join("")}<div class="sp"></div>
          <button type="button" class="btn" data-close>${esc(cfg.cancel||"Cancel")}</button>
          ${actions.filter(a=>a.kind!=="danger").map(a=>`<button type="${a.kind==="primary"?"submit":"button"}" class="btn ${a.kind==="primary"?"primary":""}" data-act="${a.name}">${esc(a.label)}</button>`).join("")}</div>
      </form></div>`;
      const ovl = $("#ovl"), fm = $("form", ovl), errEl = $("#mErr");
      const prevFocus = document.activeElement;
      const done = (val) => { modalClose = null; mr.innerHTML = ""; document.removeEventListener("keydown", onKey); if (prevFocus && prevFocus.focus) prevFocus.focus(); resolve(val); };
      modalClose = () => done(null);
      const onKey = e => { if (e.key === "Escape") done(null); };
      document.addEventListener("keydown", onKey);
      ovl.addEventListener("mousedown", e => { if (e.target === ovl) done(null); });
      $$("[data-close]", ovl).forEach(b => b.onclick = () => done(null));
      // student pickers search the API as you type
      fields.filter(f => f.type==="student").forEach(f => {
        const inp = $("#f_"+f.k), dl = $("#f_"+f.k+"_dl");
        inp.addEventListener("input", debounce(async () => {
          if (/\(#\d+\)$/.test(inp.value) || inp.value.trim().length < 1) return;
          try { const d = await api("/api/students", { query:{ search: inp.value.trim(), per_page: 15 } });
            dl.innerHTML = (d.data||[]).map(s => `<option value="${esc(studentLabel(s))}">`).join(""); } catch(e){}
        }, 220));
      });
      const collect = () => {
        const out = {}; let bad = false;
        $$(".field", fm).forEach(el => el.classList.remove("bad"));
        fields.forEach(f => {
          const el = fm.elements[f.k]; let v = el.value;
          if (f.type === "number") v = v === "" ? null : Number(v);
          else if (f.type === "student") { const m = /\(#(\d+)\)\s*$/.exec(v); v = m ? Number(m[1]) : (v.trim() ? undefined : null); }
          else if (f.type !== "password") v = v.trim() === "" ? null : v.trim();
          if (f.type === "student" && v === undefined) { fieldErr(f.k, "Pick a student from the suggestions."); bad = true; return; }
          if (f.required && (v === null || v === "")) { fieldErr(f.k, f.label + " is required."); bad = true; }
          if (!(f.type === "password" && v === "" && !f.required)) out[f.k] = v;
        });
        return bad ? null : out;
      };
      const fieldErr = (k, m) => { const el = $(`.field[data-k="${k}"]`, fm); if (el){ el.classList.add("bad"); $(".ferr", el).textContent = m; } };
      const run = async (action) => {
        errEl.classList.remove("show");
        const vals = action === "save" || !(actions.find(a=>a.name===action)||{}).skipValidate ? collect() : {};
        if (!vals) return;
        const btns = $$("button", fm); btns.forEach(b => b.disabled = true);
        try { const keep = cfg.onSubmit ? await cfg.onSubmit(vals, action) : false; if (!keep) done({ values: vals, action }); }
        catch(e){
          if (e.handled) { done(null); return; }
          if (e.errors) Object.entries(e.errors).forEach(([k,m]) => fieldErr(k.split(".")[0], m[0]));
          errEl.textContent = e.message; errEl.classList.add("show");
        } finally { btns.forEach(b => { if (b.isConnected) b.disabled = false; }); }
      };
      fm.onsubmit = (e) => { e.preventDefault(); run(actions.find(a=>a.kind==="primary")?.name || "save"); };
      $$("[data-act]", fm).forEach(b => { if (b.type !== "submit") b.onclick = () => run(b.dataset.act); });
      const first = $("input,select,textarea", fm); (first || $("[data-close]", fm)).focus();
    });
  }

  async function printReceipt(id){
    // Printed from a hidden in-page frame: no pop-up permission needed (works in
    // kiosk browsers and mobile WebViews too).
    try {
      const { school, invoice:f } = await api(`/api/fees/${id}/receipt`);
      const sc = school || {}; const cur = sc.currency || CFG.settings.currency || "INR";
      const m = n => { try { return new Intl.NumberFormat(cur==="INR"?"en-IN":undefined,{style:"currency",currency:cur}).format(Number(n||0)); } catch(e){ return cur+" "+n; } };
      const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Receipt ${esc(f.receipt_no||"")}</title>
      <style>body{font-family:system-ui,Segoe UI,Roboto,sans-serif;color:#171A2B;margin:0;padding:32px}.r{max-width:640px;margin:auto;border:1px solid #ddd;border-radius:12px;padding:28px}
      h1{margin:0;font-size:22px}.muted{color:#666;font-size:13px}table{width:100%;border-collapse:collapse;margin:18px 0}td{padding:8px 0;border-bottom:1px solid #eee;font-size:14px}td:last-child{text-align:right}
      .tot td{font-weight:800;font-size:16px;border-bottom:0}.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid #171A2B;padding-bottom:14px;margin-bottom:14px}
      .stamp{display:inline-block;border:2px solid ${Number(f.balance)>0?"#B8770B":"#0FA968"};color:${Number(f.balance)>0?"#B8770B":"#0FA968"};padding:4px 12px;border-radius:8px;font-weight:800;letter-spacing:.08em}
      @media print{body{padding:0}.r{border:0}}</style></head><body><div class="r">
      <div class="hd"><div><h1>${esc(sc.school_name||"School")}</h1><div class="muted">${esc(sc.address||"")}</div><div class="muted">${esc([sc.phone,sc.email].filter(Boolean).join(" · "))}</div></div>
      <div style="text-align:right"><b>FEE RECEIPT</b><div class="muted">${esc(f.receipt_no||"")}</div><div class="muted">${fdate(f.paid_on)}</div></div></div>
      <table><tr><td>Student</td><td><b>${esc(f.student?f.student.name:"—")}</b></td></tr><tr><td>Class</td><td>${esc(f.class_name||(f.student&&f.student.class_name)||"—")}</td></tr>
      <tr><td>Invoice</td><td>${esc(f.invoice_no)}</td></tr><tr><td>For</td><td>${esc(f.description||"School fees")}</td></tr>
      ${sc.academic_year?`<tr><td>Academic year</td><td>${esc(sc.academic_year)}</td></tr>`:""}<tr><td>Payment mode</td><td style="text-transform:uppercase">${esc(f.payment_mode||"—")}</td></tr>
      <tr><td>Invoice amount</td><td>${m(f.amount)}</td></tr><tr class="tot"><td>Total paid</td><td>${m(f.paid_amount)}</td></tr><tr><td>Balance</td><td>${m(f.balance)}</td></tr></table>
      <span class="stamp">${Number(f.balance)>0?"PART PAID":"PAID IN FULL"}</span>
      <p class="muted" style="margin-top:28px">This is a computer-generated receipt.</p></div></body></html>`;
      let fr = document.getElementById("rcptFrame");
      if (fr) fr.remove();
      fr = document.createElement("iframe");
      fr.id = "rcptFrame"; fr.title = "Fee receipt"; fr.setAttribute("aria-hidden", "true");
      fr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
      document.body.appendChild(fr);
      fr.contentDocument.open(); fr.contentDocument.write(html); fr.contentDocument.close();
      setTimeout(() => { fr.contentWindow.focus(); fr.contentWindow.print(); }, 250);
    } catch(e){ if(!e.handled) toast(e.message); }
  }

      <div class="field"><label for="pKey">License key</label>${keys.length || pre ? `<select id="pKey">${opts([...new Set([pre, ...keys.map(k=>k.key)].filter(Boolean))].map(k => { const l = keys.find(x=>x.key===k); return [k, l ? `${k} — ${l.licensee} (${l.plan})` : k]; }), pre)}</select>` : `<input id="pKey" placeholder="CHEN-XXXX-XXXX-XXXX"><div class="hint">No unused keys — <a href="#" id="toIssue">issue one first</a>.</div>`}</div>
      <div class="row"><div class="field"><label for="pName">School name</label><input id="pName" placeholder="Sunrise Academy"></div>
        <div class="field"><label for="pId">School ID (login code)</label><input id="pId" placeholder="sunrise" autocapitalize="none"><div class="hint">Lowercase letters, numbers, dashes. Staff type this to sign in.</div></div></div>
      <div class="row"><div class="field"><label for="pAName">Admin name</label><input id="pAName"></div><div class="field"><label for="pAEmail">Admin email</label><input id="pAEmail" type="email"></div></div>
      <div class="field"><label for="pAPass">Admin password</label><div style="display:flex;gap:8px"><input id="pAPass" value="${gen()}" autocomplete="off"><button type="button" class="btn" id="genPw">New</button></div><div class="hint">Share with the school admin securely; they can change it after signing in.</div></div>
      <button class="btn primary" type="submit" id="pGo">Provision school</button><div id="pOut" style="margin-top:14px"></div></div></form>`;
    let idTouched = false;
    $("#pId").addEventListener("input", () => idTouched = true);
    $("#pName").addEventListener("input", () => { if (!idTouched) $("#pId").value = $("#pName").value.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30); });
    $("#genPw").onclick = () => $("#pAPass").value = gen();
    if ($("#toIssue")) $("#toIssue").onclick = (e) => { e.preventDefault(); go("issue"); };
    $("#pf").onsubmit = async (e) => {
      e.preventDefault(); const err = $("#pErr"); err.classList.remove("show");
      const body = { license_key: $("#pKey").value.trim(), name: $("#pName").value.trim(), id: $("#pId").value.trim(),
        admin_name: $("#pAName").value.trim(), admin_email: $("#pAEmail").value.trim(), admin_password: $("#pAPass").value };
      const missing = Object.entries(body).filter(([,x]) => !x).map(([k]) => k.replace(/_/g," "));
      if (missing.length) { err.textContent = "Please fill in: " + missing.join(", "); err.classList.add("show"); return; }
      const btn = $("#pGo"); btn.disabled = true; btn.textContent = "Creating school database…";
      try {
        await api("/api/central/schools", { method:"POST", body });
        const handover = `Scholar ERP — your school is ready\nServer: ${S.base}\nSchool ID: ${body.id}\nAdmin email: ${body.admin_email}\nPassword: ${body.admin_password}\n(Please change the password after first sign-in.)`;
        $("#pOut").innerHTML = `<div class="panel-b" style="background:var(--green-wash);border-radius:12px"><b>School provisioned.</b> Hand-over details:
          <pre class="mono small" style="white-space:pre-wrap;margin:10px 0">${esc(handover)}</pre><button type="button" class="btn sm" id="cpH">Copy hand-over note</button> <button type="button" class="btn sm" id="toSchools">View schools</button></div>`;
        $("#cpH").onclick = () => navigator.clipboard && navigator.clipboard.writeText(handover).then(() => toast("Copied"));
        $("#toSchools").onclick = () => go("schools");
        toast("School provisioned"); btn.textContent = "Provisioned ✓";
      } catch(e){ btn.disabled = false; btn.textContent = "Provision school"; if(!e.handled){ err.textContent = e.message; err.classList.add("show"); } }
    };
  };

  // ---- boot ----
  if (S.token && S.mode) renderApp(); else renderLogin();
})();
</script>
</body>
</html>
