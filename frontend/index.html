<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scholar ERP — School Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#F5F6FA;--surface:#FFFFFF;--surface-2:#FBFBFE;--line:#E7E9F1;
    --ink:#171A2B;--ink-2:#5A5F76;--ink-3:#8A8FA6;
    --primary:#2B4EE6;--primary-ink:#1B34AE;--primary-wash:#EDF0FE;
    --accent:#F59E0B;--accent-wash:#FEF3E2;--green:#0FA968;--green-wash:#E6F7EF;
    --red:#E5484D;--red-wash:#FCEEEE;
    --radius:14px;--radius-sm:10px;--shadow:0 1px 2px rgba(23,26,43,.04),0 8px 24px rgba(23,26,43,.06);
    --font:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--sidebar-w:250px;
  }
  :root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
    --bg:#0D0F1A;--surface:#161927;--surface-2:#1B1F30;--line:#272B3D;--ink:#EDEEF5;--ink-2:#A6ABC2;--ink-3:#71768F;
    --primary:#6E88F6;--primary-ink:#AEBEFB;--primary-wash:#1E2440;--accent:#F5B342;--accent-wash:#3A2E14;
    --green:#3ECf8E;--green-wash:#12321F;--red:#F16A6E;--red-wash:#3A1D1E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);}}
  :root[data-theme="dark"]{
    --bg:#0D0F1A;--surface:#161927;--surface-2:#1B1F30;--line:#272B3D;--ink:#EDEEF5;--ink-2:#A6ABC2;--ink-3:#71768F;
    --primary:#6E88F6;--primary-ink:#AEBEFB;--primary-wash:#1E2440;--accent:#F5B342;--accent-wash:#3A2E14;
    --green:#3ECf8E;--green-wash:#12321F;--red:#F16A6E;--red-wash:#3A1D1E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}button{font-family:inherit}a{color:var(--primary);text-decoration:none}
  :focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--primary);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600}
  .skip:focus{left:12px}
  .shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100%}
  .sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-top:env(safe-area-inset-top,0px)}
  .brand{display:flex;align-items:center;gap:11px;padding:20px 20px 12px}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#5B72F0);display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none}
  .brand b{font-size:16px;font-weight:800;letter-spacing:-.02em}.brand small{display:block;color:var(--ink-3);font-size:11px;font-weight:600}
  .status{display:flex;align-items:center;gap:7px;margin:0 20px 12px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
  .status .led{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
  .status.online .led{background:var(--green);box-shadow:0 0 0 3px var(--green-wash)}
  .status.offline .led{background:var(--accent)}
  .school-pick{margin:0 14px 10px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);display:flex;align-items:center;gap:9px;cursor:pointer;width:calc(100% - 28px)}
  .school-pick .ico{width:26px;height:26px;border-radius:7px;background:var(--accent-wash);display:grid;place-items:center;flex:none}
  .school-pick .txt{text-align:left;line-height:1.2;overflow:hidden}
  .school-pick .txt b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .school-pick .txt span{font-size:11px;color:var(--ink-3)}.school-pick .chev{margin-left:auto;color:var(--ink-3);flex:none}
  .nav{overflow-y:auto;padding:6px 12px 16px;flex:1}
  .nav .group{color:var(--ink-3);font-size:11px;font-weight:700;padding:14px 12px 6px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--ink-2);padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:600;text-align:left;transition:background .12s,color .12s;margin-bottom:1px}
  .nav button .i{width:18px;height:18px;flex:none}.nav button:hover{background:var(--surface-2);color:var(--ink)}
  .nav button[aria-current="page"]{background:var(--primary-wash);color:var(--primary-ink)}
  .nav button .badge{margin-left:auto;background:var(--accent);color:#3a2600;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 22px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .hamburger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;width:38px;height:38px;place-items:center;cursor:pointer;flex:none}
  .page-title{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .search{position:relative;margin-left:6px;flex:1;max-width:360px}
  .search input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px 9px 36px;font-size:14px;color:var(--ink)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
  .topbar .spacer{flex:1}
  .icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);position:relative}
  .icon-btn:hover{color:var(--ink)}
  .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
  .me{display:flex;align-items:center;gap:9px}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#F97316);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
  .me .who{line-height:1.15}.me .who b{font-size:13px}.me .who span{font-size:11px;color:var(--ink-3)}
  .content{padding:22px;max-width:1180px;width:100%}
  @media(min-width:1400px){.content{margin:0 auto}}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow)}
  .kpi .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .kpi .cap{color:var(--ink-2);font-size:13px;font-weight:600}
  .kpi .glyph{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
  .kpi .num{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi .delta{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:3px;margin-top:6px}
  .up{color:var(--green)}.down{color:var(--red)}.muted{color:var(--ink-3)}
  .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .panel-h h2{font-size:15px}.panel-h a{font-size:13px;font-weight:600}.panel-b{padding:16px 18px}
  .chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:8px}
  .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
  .bar{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--primary),#6E88F6);transition:height .5s cubic-bezier(.2,.7,.3,1)}
  .bar.alt{background:linear-gradient(180deg,var(--accent),#F7C15A)}.bar-lbl{font-size:11px;color:var(--ink-3);font-weight:600}
  .act{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.act:last-child{border-bottom:0}
  .act .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
  .act .tx b{font-size:13.5px;display:block}.act .tx span{font-size:12px;color:var(--ink-3)}
  .act time{margin-left:auto;font-size:11px;color:var(--ink-3);white-space:nowrap}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--surface-2)}.btn:disabled{opacity:.5;cursor:default}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-ink)}
  .toolbar .grow{flex:1}
  .field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14px;color:var(--ink);font-family:inherit}
  table{width:100%;border-collapse:collapse}
  .tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
  th{text-align:left;font-size:12px;color:var(--ink-2);font-weight:700;padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--surface-2)}
  .stu{display:flex;align-items:center;gap:10px}
  .stu .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
  .pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block}
  .pill.paid,.pill.present{background:var(--green-wash);color:var(--green)}
  .pill.due,.pill.absent{background:var(--red-wash);color:var(--red)}
  .pill.partial{background:var(--accent-wash);color:#B8770B}.pill.leave{background:var(--primary-wash);color:var(--primary-ink)}
  .row-act{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:6px;border-radius:8px}
  .row-act:hover{background:var(--surface-2);color:var(--ink)}
  .att-btns{display:inline-flex;gap:6px}
  .att-btns button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2)}
  .att-btns button.on-p{background:var(--green);border-color:var(--green);color:#fff}
  .att-btns button.on-a{background:var(--red);border-color:var(--red);color:#fff}
  .stub{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--ink-2)}
  .stub .big{width:60px;height:60px;border-radius:16px;background:var(--primary-wash);color:var(--primary-ink);display:grid;place-items:center;margin:0 auto 16px}
  .stub h2{font-size:18px;color:var(--ink);margin-bottom:6px}.stub p{max-width:400px;margin:0 auto}
  .loading{padding:60px;text-align:center;color:var(--ink-3);font-weight:600}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);z-index:200;transition:transform .3s;display:flex;align-items:center;gap:9px;margin-bottom:env(safe-area-inset-bottom,0px)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .scrim{position:fixed;inset:0;background:rgba(10,12,22,.45);z-index:150;display:none;align-items:center;justify-content:center;padding:18px}
  .scrim.show{display:flex}
  .modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:460px;overflow:hidden}
  .modal-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-h h2{font-size:17px}.modal-b{padding:20px}
  .lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
  .modal-b input,.modal-b select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);font-family:inherit;margin-bottom:14px}
  .modal-f{display:flex;gap:10px;justify-content:flex-end;padding:0 20px 20px}
  .scrim-nav{display:none}
  @media(max-width:860px){
    .shell{grid-template-columns:1fr}
    .sidebar{position:fixed;z-index:60;left:0;top:0;width:270px;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}
    .sidebar.open{transform:translateX(0)}.hamburger{display:grid}
    .scrim-nav{position:fixed;inset:0;background:rgba(10,12,22,.4);z-index:50}.scrim-nav.show{display:block}
    .search{display:none}.kpi .num{font-size:24px}
  }
  @media(max-width:520px){.content{padding:16px}.me .who{display:none}.topbar{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<a href="#main" class="skip">Skip to main content</a>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <div class="brand"><div class="mark" aria-hidden="true">S</div>
      <div><b>Scholar ERP</b><small>One platform. Every school.</small></div></div>
    <div class="status" id="status" role="status" aria-live="polite"><span class="led"></span><span id="statusTxt">Connecting to database…</span></div>
    <button class="school-pick" id="schoolPick" aria-haspopup="listbox">
      <span class="ico" aria-hidden="true">🏫</span>
      <span class="txt"><b id="schoolName">Greenfield Public School</b><span>Branch: Main · 2025–26</span></span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </aside>
  <div class="scrim-nav" id="scrimNav"></div>
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <div class="search" role="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" placeholder="Search students, staff, invoices…" aria-label="Search"></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeBtn" aria-label="Switch to dark theme" aria-pressed="false">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M18.3 5.7l1.4-1.4"/></svg></button>
      <button class="icon-btn" aria-label="Notifications, 3 unread"><span class="dot"></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <div class="me"><div class="avatar" aria-hidden="true">RA</div><div class="who"><b>Rahul Admin</b><span>Administrator</span></div></div>
    </header>
    <main class="content" id="main" tabindex="-1"><div class="loading">Loading…</div></main>
  </div>
</div>
<div class="scrim" id="modalScrim" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-h"><h2 id="modalTitle">Add student</h2>
      <button class="row-act" id="modalClose" aria-label="Close dialog">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-b">
      <label class="lbl" for="mName">Full name</label><input id="mName" placeholder="e.g. Aarav Sharma">
      <label class="lbl" for="mClass">Class</label>
      <select id="mClass"><option>Class 6-A</option><option>Class 7-B</option><option>Class 8-A</option><option>Class 9-C</option><option>Class 10-A</option></select>
      <label class="lbl" for="mRoll">Roll number</label><input id="mRoll" type="number" placeholder="e.g. 24"></div>
    <div class="modal-f"><button class="btn" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalSave">Save student</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

    admissions:[

  /* ---------------- Router / render ---------------- */
  let current="dashboard";
  function go(view){
    if(!views[view])view="dashboard";
    current=view;
    document.getElementById("pageTitle").textContent=TITLES[view];
    renderCurrent();
    document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.view===view?"page":"false"));
    document.getElementById("main").focus();
    try{localStorage.setItem("scholar_view",view);}catch(e){}
  }
  function renderCurrent(){
    const main=document.getElementById("main");
    if(!state.ready){main.innerHTML='<div class="loading">Connecting to the school database…</div>';return;}
    main.innerHTML=views[current]();
    wireView(current);
  }
  function reRender(){ buildNav(); if(state.ready) renderCurrent(); }

  function wireView(view){
    document.querySelectorAll('[data-view]').forEach(el=>{if(el.tagName==="A")el.addEventListener("click",e=>{e.preventDefault();go(el.dataset.view);});});
    if(view==="students"){
      const add=document.getElementById("addStudent"); if(add)add.addEventListener("click",openModal);
      const s=document.getElementById("stuSearch");
      if(s)s.addEventListener("input",()=>{ui.stuFilter=s.value;
        document.querySelectorAll("#stuBody tr").forEach(tr=>{tr.style.display=tr.textContent.toLowerCase().includes(ui.stuFilter.toLowerCase())?"":"none";});});
    }
    if(view==="fees"){
      document.querySelectorAll("[data-collect]").forEach(b=>b.addEventListener("click",()=>collectFee(b.dataset.collect,b)));
    }
    if(view==="attendance"){
      document.querySelectorAll("[data-att]").forEach(b=>b.addEventListener("click",()=>{
        state.pendingAtt[b.dataset.att]=b.dataset.v; renderCurrent();
      }));
      const sa=document.getElementById("saveAtt"); if(sa)sa.addEventListener("click",saveAttendance);
    }
    if(view==="admissions"){
      document.querySelectorAll("[data-adm-approve]").forEach(b=>b.addEventListener("click",()=>setAdmission(b.dataset.admApprove,"approved")));
      document.querySelectorAll("[data-adm-reject]").forEach(b=>b.addEventListener("click",()=>setAdmission(b.dataset.admReject,"rejected")));
      document.querySelectorAll("[data-adm-enroll]").forEach(b=>b.addEventListener("click",()=>enrollAdmission(b.dataset.admEnroll,b)));
    }
    if(view==="timetable"){
      const sel=document.getElementById("ttClass");
      if(sel)sel.addEventListener("change",()=>{state.ttClass=sel.value;renderCurrent();});
    }
    if(view==="library"){
      document.querySelectorAll("[data-issue]").forEach(b=>b.addEventListener("click",()=>adjustBook(b.dataset.issue,-1,"Book issued")));
      document.querySelectorAll("[data-return]").forEach(b=>b.addEventListener("click",()=>adjustBook(b.dataset.return,1,"Book returned")));
    }
    if(view==="hostel"){
      document.querySelectorAll("[data-allot]").forEach(b=>b.addEventListener("click",()=>adjustRoom(b.dataset.allot,1,"Bed allotted")));
      document.querySelectorAll("[data-vacate]").forEach(b=>b.addEventListener("click",()=>adjustRoom(b.dataset.vacate,-1,"Bed vacated")));
    }
    if(view==="communication"){
      const s=document.getElementById("sendAn"); if(s)s.addEventListener("click",sendAnnouncement);
    }
    if(view==="reports"){
      document.querySelectorAll("[data-report]").forEach(b=>b.addEventListener("click",()=>toast("Export queued: "+b.dataset.report+" (wire to /api/reports)")));
    }
    if(view==="settings"){
      const sv=document.getElementById("saveSet"); if(sv)sv.addEventListener("click",saveSetting);
    }
  }

  /* ---------------- Writes ---------------- */
  async function addStudent(name,cls,roll){
    const doc={name,cls,roll:Number(roll)||0,fee:"due",att:100,createdAt:Date.now()};
    if(db){ try{await db.collection("students").add(doc); toast(name+" added to database");}catch(e){toast("Could not save — "+(e.code||"error"));} }
    else{ state.students.push(Object.assign({id:"local"+Date.now()},doc)); saveOffline(); reRender(); toast(name+" added (offline)"); }
  }
  async function collectFee(id,btn){
    if(btn)btn.disabled=true;
    if(db){ try{await db.collection("fees").doc(id).update({status:"paid",date:TODAY_LBL}); toast("Payment recorded");}catch(e){toast("Could not record — "+(e.code||"error"));if(btn)btn.disabled=false;} }
    else{ const f=state.fees.find(x=>x.id===id); if(f){f.status="paid";f.date=TODAY_LBL;} saveOffline(); reRender(); toast("Payment recorded (offline)"); }
  }
  async function saveAttendance(){
    const marks=Object.assign({},state.attToday,state.pendingAtt);
    if(db){ try{await db.doc("attendance/"+TODAY).set({date:TODAY,marks,savedAt:Date.now()}); state.pendingAtt={}; toast("Attendance saved");}catch(e){toast("Could not save — "+(e.code||"error"));} }
    else{ state.attToday=marks; state.pendingAtt={}; saveOffline(); reRender(); toast("Attendance saved (offline)"); }
  }
  async function setAdmission(id,status){
    if(db){ try{await db.collection("admissions").doc(id).update({status}); toast("Application "+status);}catch(e){toast("Could not update — "+(e.code||"error"));} }
    else{ const a=state.admissions.find(x=>x.id===id); if(a)a.status=status; saveOffline(); reRender(); toast("Application "+status+" (offline)"); }
  }
  async function enrollAdmission(id,btn){
    if(btn)btn.disabled=true;
    const a=state.admissions.find(x=>x.id===id); if(!a)return;
    const student={name:a.applicant,cls:a.cls,roll:0,fee:"due",att:100,createdAt:Date.now()};
    if(db){ try{ await db.collection("students").add(student); await db.collection("admissions").doc(id).update({status:"enrolled"}); toast(a.applicant+" enrolled as a student"); }catch(e){toast("Could not enroll — "+(e.code||"error"));if(btn)btn.disabled=false;} }
    else{ state.students.push(Object.assign({id:"local"+Date.now()},student)); a.status="enrolled"; saveOffline(); reRender(); toast(a.applicant+" enrolled (offline)"); }
  }
  async function adjustBook(id,delta,msg){
    const b=state.books.find(x=>x.id===id); if(!b)return;
    const next=Math.max(0,Math.min(b.total,b.available+delta));
    if(db){ try{await db.collection("books").doc(id).update({available:next}); toast(msg);}catch(e){toast("Failed — "+(e.code||"error"));} }
    else{ b.available=next; saveOffline(); reRender(); toast(msg+" (offline)"); }
  }
  async function adjustRoom(id,delta,msg){
    const r=state.rooms.find(x=>x.id===id); if(!r)return;
    const next=Math.max(0,Math.min(r.capacity,r.occupied+delta));
    if(db){ try{await db.collection("rooms").doc(id).update({occupied:next}); toast(msg);}catch(e){toast("Failed — "+(e.code||"error"));} }
    else{ r.occupied=next; saveOffline(); reRender(); toast(msg+" (offline)"); }
  }
  async function sendAnnouncement(){
    const title=(document.getElementById("anTitle").value||"").trim();
    const body=(document.getElementById("anBody").value||"").trim();
    if(!title||!body){toast("Add a title and message");return;}
    const channel=document.getElementById("anCh").value, audience=document.getElementById("anAud").value;
    const recipients=audience==="staff"?state.staff.length:(audience==="all"?state.students.length+state.staff.length:state.students.length);
    const doc={title,body,channel,audience,recipients,when:"just now",createdAt:Date.now()};
    if(db){ try{await db.collection("announcements").add(doc); toast("Announcement sent to "+recipients+" recipients");}catch(e){toast("Failed — "+(e.code||"error"));} }
    else{ state.announcements.unshift(Object.assign({id:"local"+Date.now()},doc)); saveOffline(); reRender(); toast("Announcement sent (offline)"); }
  }
  async function saveSetting(){
    const year=(document.getElementById("setYear").value||"").trim();
    const next=Object.assign({},state.settings,{academic_year:year});
    if(db){ try{await db.doc("config/settings").set(next); toast("Settings saved");}catch(e){toast("Failed — "+(e.code||"error"));} }
    else{ state.settings=next; saveOffline(); reRender(); toast("Settings saved (offline)"); }
  }

  /* ---------------- Offline persistence ---------------- */
  function loadOffline(){
    try{const raw=localStorage.getItem("scholar_offline");
      if(raw){const d=JSON.parse(raw);Object.assign(state,{students:d.students,fees:d.fees,staff:d.staff,exams:d.exams,admissions:d.admissions||SAMPLE.admissions.slice(),timetable:d.timetable||SAMPLE.timetable.slice(),books:d.books||SAMPLE.books.slice(),vehicles:d.vehicles||SAMPLE.vehicles.slice(),rooms:d.rooms||SAMPLE.rooms.slice(),announcements:d.announcements||SAMPLE.announcements.slice(),settings:d.settings||Object.assign({},SAMPLE.settings),attToday:d.attToday||{}});return;}
    }catch(e){}
    state.students=SAMPLE.students.slice();state.fees=SAMPLE.fees.slice();state.staff=SAMPLE.staff.slice();state.exams=SAMPLE.exams.slice();
    state.admissions=SAMPLE.admissions.slice();state.timetable=SAMPLE.timetable.slice();
    state.books=SAMPLE.books.slice();state.vehicles=SAMPLE.vehicles.slice();state.rooms=SAMPLE.rooms.slice();
    state.announcements=SAMPLE.announcements.slice();state.settings=Object.assign({},SAMPLE.settings);state.attToday={};
  }
  function saveOffline(){ try{localStorage.setItem("scholar_offline",JSON.stringify({students:state.students,fees:state.fees,staff:state.staff,exams:state.exams,admissions:state.admissions,timetable:state.timetable,books:state.books,vehicles:state.vehicles,rooms:state.rooms,announcements:state.announcements,settings:state.settings,attToday:state.attToday}));}catch(e){} }

  /* ---------------- Backend init ---------------- */
  function setStatus(mode){
    const el=document.getElementById("status"),tx=document.getElementById("statusTxt");
    el.className="status "+mode;
    tx.textContent = mode==="online"?"Live database · syncing":(mode==="offline"?"Offline demo · saved locally":"Connecting to database…");
  }
  function collect(snap){return snap.docs.map(d=>Object.assign({id:d.id},d.data()));}

  async function initBackend(){
    try{ if(window.claude&&window.claude.use){ db=await claude.use("db"); } }catch(e){ db=null; }
    if(!db){ state.mode="offline"; setStatus("offline"); loadOffline(); state.ready=true; reRender(); return; }
    state.mode="online"; setStatus("online");
    const onErr=e=>{ if(e&&(e.code==="not_granted"||e.code==="revoked"||e.code==="capability_disabled")){ db=null; state.mode="offline"; setStatus("offline"); loadOffline(); state.ready=true; reRender(); } };
    db.collection("students").onSnapshot(s=>{state.students=collect(s);state.ready=true;reRender();},onErr);
    db.collection("fees").onSnapshot(s=>{state.fees=collect(s);reRender();},onErr);
    db.collection("staff").onSnapshot(s=>{state.staff=collect(s);reRender();},onErr);
    db.collection("exams").onSnapshot(s=>{state.exams=collect(s);reRender();},onErr);
    db.collection("admissions").onSnapshot(s=>{state.admissions=collect(s);reRender();},onErr);
    db.collection("timetable").onSnapshot(s=>{state.timetable=collect(s);reRender();},onErr);
    db.collection("books").onSnapshot(s=>{state.books=collect(s);reRender();},onErr);
    db.collection("vehicles").onSnapshot(s=>{state.vehicles=collect(s);reRender();},onErr);
    db.collection("rooms").onSnapshot(s=>{state.rooms=collect(s);reRender();},onErr);
    db.collection("announcements").onSnapshot(s=>{state.announcements=collect(s).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));reRender();},onErr);
    db.doc("config/settings").onSnapshot(s=>{if(s.exists)state.settings=s.data();reRender();},onErr);
    db.doc("attendance/"+TODAY).onSnapshot(s=>{state.attToday=s.exists?((s.data().marks)||{}):{};reRender();},onErr);
    // Safety: if nothing arrives, still render
    setTimeout(()=>{ if(!state.ready){state.ready=true;reRender();} },6000);
  }

  /* ---------------- Modal ---------------- */
  const scrim=document.getElementById("modalScrim"); let lastFocus=null;
  function openModal(){lastFocus=document.activeElement;scrim.classList.add("show");document.getElementById("mName").focus();}
  function closeModal(){scrim.classList.remove("show");if(lastFocus)lastFocus.focus();}
  document.getElementById("modalClose").addEventListener("click",closeModal);
  document.getElementById("modalCancel").addEventListener("click",closeModal);
  scrim.addEventListener("click",e=>{if(e.target===scrim)closeModal();});
  document.getElementById("modalSave").addEventListener("click",async()=>{
    const name=document.getElementById("mName").value.trim(); if(!name){document.getElementById("mName").focus();return;}
    const cls=document.getElementById("mClass").value, roll=document.getElementById("mRoll").value||(state.students.length+1);
    document.getElementById("mName").value="";document.getElementById("mRoll").value="";
    closeModal(); await addStudent(name,cls,roll);
  });

  /* ---------------- Toast ---------------- */
  let tTimer;
  function toast(msg){const t=document.getElementById("toast");
    t.innerHTML=svg('<path d="M20 6 9 17l-5-5"/>')+"<span>"+msg+"</span>";
    t.classList.add("show");clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove("show"),2600);}

  /* ---------------- Drawer ---------------- */
  const sidebar=document.getElementById("sidebar"),scrimNav=document.getElementById("scrimNav"),ham=document.getElementById("hamburger");
  function openDrawer(){sidebar.classList.add("open");scrimNav.classList.add("show");ham.setAttribute("aria-expanded","true");}
  function closeDrawer(){sidebar.classList.remove("open");scrimNav.classList.remove("show");ham.setAttribute("aria-expanded","false");}
  ham.addEventListener("click",()=>sidebar.classList.contains("open")?closeDrawer():openDrawer());
  scrimNav.addEventListener("click",closeDrawer);

  /* ---------------- Theme ---------------- */
  const themeBtn=document.getElementById("themeBtn"),root=document.documentElement;
  function applyTheme(t){root.setAttribute("data-theme",t);const dark=t==="dark";
    themeBtn.setAttribute("aria-pressed",dark);themeBtn.setAttribute("aria-label",dark?"Switch to light theme":"Switch to dark theme");
    document.getElementById("themeIcon").innerHTML=dark?'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>':'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M18.3 5.7l1.4-1.4"/>';
    try{localStorage.setItem("scholar_theme",t);}catch(e){}}
  themeBtn.addEventListener("click",()=>applyTheme(root.getAttribute("data-theme")==="dark"?"light":"dark"));

  document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(scrim.classList.contains("show"))closeModal();else closeDrawer();}});

  /* ---------------- Boot ---------------- */
  try{const st=localStorage.getItem("scholar_theme");if(st)applyTheme(st);}catch(e){}
  try{current=localStorage.getItem("scholar_view")||"dashboard";}catch(e){}
  buildNav();
  document.getElementById("schoolPick").addEventListener("click",()=>toast("Multi-tenant: switch between unlimited schools here"));
  initBackend();
})();
</script>
</body>
</html>
