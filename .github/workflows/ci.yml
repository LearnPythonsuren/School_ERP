name: CI — build & test Scholar ERP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - name: PHP syntax check
        run: |
          fail=0
          for f in $(find backend -name '*.php'); do
            php -l "$f" | grep -q "No syntax errors" || { echo "FAIL $f"; fail=1; }
          done
          [ "$fail" = "0" ] && echo "All backend PHP files pass."; exit $fail
      - name: JS syntax check (both frontends)
        run: |
          for f in frontend/index.html frontend/app.html; do
            node -e "const fs=require('fs');const h=fs.readFileSync('$f','utf8');const m=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]).join('\n');fs.writeFileSync('/tmp/app.js',m);"
            node --check /tmp/app.js && echo "$f JS OK"
          done

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, sqlite3, pdo_sqlite, bcmath, intl
          tools: composer
      - name: Install (same script customers run)
        run: SCHOLAR_APP_DIR="$RUNNER_TEMP/app" bash setup.sh
      - name: API tests (control plane, every module, roles, live license gate)
        run: |
          cd "$RUNNER_TEMP/app"
          # Cache like production does — catches anything that only works uncached.
          php artisan config:cache && php artisan route:cache
          php artisan serve --host=127.0.0.1 --port=8000 </dev/null >/tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health >/dev/null && break; sleep 1; done
          cd "$GITHUB_WORKSPACE"
          bash test-api.sh || { cat /tmp/serve.log; tail -n 80 "$RUNNER_TEMP/app/storage/logs/laravel.log" 2>/dev/null; exit 1; }
      - name: Upgrade path (setup.sh --update keeps data)
        run: |
          SCHOLAR_APP_DIR="$RUNNER_TEMP/app" bash setup.sh --update
          cd "$RUNNER_TEMP/app" && php artisan tinker --execute="echo App\Models\Tenant::count();" | grep -q '[1-9]'
